[project]
name = "reporter"
version = "0.1.0"
description = "ObsPy test reporter app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.14,<6.0",
    "django-csp",
    "django-mptt",
    "django-mptt-admin",
    "django-taggit",
    "lxml>=6.1.0",
    "sqlparse>=0.5.5",
]

[tool.uv]
exclude-newer = "14 days"
exclude-newer-package = { django = false }

[dependency-groups]
dev = [
    "psycopg[binary]",
    "django-debug-toolbar",
    "django-debug-toolbar-template-profiler",
    "ruff",
]
